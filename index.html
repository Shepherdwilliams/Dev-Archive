
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://developmentarchive.net/" />
    <meta property="og:title" content="The Development Archive | Interactive Science & STEM Learning" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Development Archive" />
    <meta name="twitter:description" content="Interactive STEM education platform featuring orbital physics, periodic table tools, and AI science prompts." />

    <!-- Cache Controls -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'brand-black': '#212529',
              'brand-gray-dark': '#495057',
              'brand-green': '#8AC926',
              'brand-green-dark': '#73A820',
              'brand-red': '#E63946',
              'brand-off-white': '#F8F9FA',
              'brand-light-gray': '#CED4DA',
              'brand-border': '#343A40',
            },
            backdropBlur: {
              'xs': '2px',
            }
          }
        }
      }
    </script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: -1;
        background-image: radial-gradient(rgba(138, 201, 38, 0.1) 1px, transparent 1px);
        background-size: 20px 20px;
        animation: moveGrid 30s linear infinite;
      }

      @keyframes moveGrid {
        from {
          background-position: 0 0;
        }
        to {
          background-position: -200px -200px;
        }
      }
    </style>
<link rel="stylesheet" href="/index.css">
